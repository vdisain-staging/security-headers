name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build installable plugin zip
        run: |
          mkdir -p dist/vdisain-security-headers
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'dist' \
            ./ dist/vdisain-security-headers/
          cd dist
          zip -r vdisain-security-headers.zip vdisain-security-headers

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/vdisain-security-headers.zip
